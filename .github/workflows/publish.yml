name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Verify, Publish to npm (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.repository == 'AdoShan/OpenClaw-ModelFetch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm --version
          npm install -g npm@latest
          npm --version
          echo "OIDC token endpoint present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" || { echo '::error::no OIDC endpoint'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Tag $TAG matches package.json version $PKG"

      - name: Check whether this version is already on npm
        id: published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          set +e
          OUTPUT="$(npm view "openclaw-plugin-model-fetch@${VERSION}" version 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published; npm publish will be skipped."
          elif printf '%s' "$OUTPUT" | grep -q 'code E404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not published yet."
          else
            echo "::error::Unable to determine whether version ${VERSION} is published"
            printf '%s\n' "$OUTPUT"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run plugin:build

      - name: Validate plugin
        run: npm run plugin:validate

      - name: Create draft GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Model Fetch v0.2.5

            Applying a provider strategy now keeps models that are still referenced by additional OpenClaw model consumers, preventing dangling configuration references.

            ## Fixes

            - **Reference protection now covers OpenClaw's explicit model consumers.** Model Fetch protects primary, heartbeat, subagent, compaction, and memory-flush models, as well as media, PDF, utility, decision, image, and voice models.
            - **Additional tool and channel references are protected.** Exec reviewer, tools media preferred models, root and Agent TTS summary models, `channels.modelByChannel`, and Discord voice references are retained when they point to a pending deletion.
            - **Deletion plans remain auditable.** Confirmation and apply results continue to show the exact configuration path that kept each protected model.

            ## Compatibility

            - No configuration migration is required.
            - Replacement mode still removes unreferenced models that do not pass the saved filter after confirmation.
            - Requires OpenClaw `2026.10.5` or newer.

            ## Verification

            - `npm test` — 73 tests passed.
            - `npm run typecheck` — passed.
            - `npm run plugin:validate` — passed.

            **Full Changelog**: https://github.com/AdoShan/OpenClaw-ModelFetch/compare/v0.2.4...v0.2.5
          draft: true
          generate_release_notes: false

      - name: Publish dry run
        if: startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.exists != 'true'
        run: npm publish --dry-run --access public

      - name: Publish to npm via Trusted Publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Model Fetch v0.2.5

            Applying a provider strategy now keeps models that are still referenced by additional OpenClaw model consumers, preventing dangling configuration references.

            ## Fixes

            - **Reference protection now covers OpenClaw's explicit model consumers.** Model Fetch protects primary, heartbeat, subagent, compaction, and memory-flush models, as well as media, PDF, utility, decision, image, and voice models.
            - **Additional tool and channel references are protected.** Exec reviewer, tools media preferred models, root and Agent TTS summary models, `channels.modelByChannel`, and Discord voice references are retained when they point to a pending deletion.
            - **Deletion plans remain auditable.** Confirmation and apply results continue to show the exact configuration path that kept each protected model.

            ## Compatibility

            - No configuration migration is required.
            - Replacement mode still removes unreferenced models that do not pass the saved filter after confirmation.
            - Requires OpenClaw `2026.10.5` or newer.

            ## Verification

            - `npm test` — 73 tests passed.
            - `npm run typecheck` — passed.
            - `npm run plugin:validate` — passed.

            **Full Changelog**: https://github.com/AdoShan/OpenClaw-ModelFetch/compare/v0.2.4...v0.2.5
          generate_release_notes: false
          draft: false
          make_latest: true
