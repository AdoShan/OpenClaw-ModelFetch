name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Verify, Publish to npm (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.repository == 'AdoShan/OpenClaw-ModelFetch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm --version
          npm install -g npm@latest
          npm --version
          echo "OIDC token endpoint present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" || { echo '::error::no OIDC endpoint'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Tag $TAG matches package.json version $PKG"

      - name: Check whether this version is already on npm
        id: published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          set +e
          OUTPUT="$(npm view "openclaw-plugin-model-fetch@${VERSION}" version 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published; npm publish will be skipped."
          elif printf '%s' "$OUTPUT" | grep -q 'code E404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not published yet."
          else
            echo "::error::Unable to determine whether version ${VERSION} is published"
            printf '%s\n' "$OUTPUT"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run plugin:build

      - name: Validate plugin
        run: npm run plugin:validate

      - name: Create draft GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Model Fetch v0.2.4

            Applying a provider strategy now clears stale model selections across every configured agent and session, while the release pipeline publishes npm and GitHub Releases from the same immutable tag.

            ## Fixes

            - **All affected sessions are reset together.** Model Fetch now scans sessions across all configured agents instead of only the current WebUI session. The confirmation dialog lists every session that will fall back to the default model, and the apply result reports how many sessions were reset.
            - **Stale sessions are handled safely.** Locked sessions are always skipped, each session is rechecked immediately before it is patched, and one failed session does not stop the remaining cleanups.
            - **Release publishing is single-track.** Real npm publishing is restricted to `vX.Y.Z` tag pushes, all releases share one concurrency queue, npm availability is checked with a fail-closed error policy, and GitHub Releases are created as drafts before npm publishing and published only after verification and publishing succeed.

            ## Compatibility

            - No configuration migration is required.
            - The provider replacement behavior remains intentional: models that do not pass the saved filter are removed after confirmation.
            - Requires OpenClaw `2026.10.5` or newer.

            ## Verification

            - `npm test` — 70 tests passed.
            - `npm run typecheck` — passed.
            - `npm run plugin:validate` — passed.
            - Manual WebUI verification confirmed affected sessions are listed before applying and reset after applying.

            **Full Changelog**: https://github.com/AdoShan/OpenClaw-ModelFetch/compare/v0.2.3...v0.2.4
          draft: true
          generate_release_notes: false

      - name: Publish dry run
        if: startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.exists != 'true'
        run: npm publish --dry-run --access public

      - name: Publish to npm via Trusted Publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Model Fetch v0.2.4

            Applying a provider strategy now clears stale model selections across every configured agent and session, while the release pipeline publishes npm and GitHub Releases from the same immutable tag.

            ## Fixes

            - **All affected sessions are reset together.** Model Fetch now scans sessions across all configured agents instead of only the current WebUI session. The confirmation dialog lists every session that will fall back to the default model, and the apply result reports how many sessions were reset.
            - **Stale sessions are handled safely.** Locked sessions are always skipped, each session is rechecked immediately before it is patched, and one failed session does not stop the remaining cleanups.
            - **Release publishing is single-track.** Real npm publishing is restricted to `vX.Y.Z` tag pushes, all releases share one concurrency queue, npm availability is checked with a fail-closed error policy, and GitHub Releases are created as drafts before npm publishing and published only after verification and publishing succeed.

            ## Compatibility

            - No configuration migration is required.
            - The provider replacement behavior remains intentional: models that do not pass the saved filter are removed after confirmation.
            - Requires OpenClaw `2026.10.5` or newer.

            ## Verification

            - `npm test` — 70 tests passed.
            - `npm run typecheck` — passed.
            - `npm run plugin:validate` — passed.
            - Manual WebUI verification confirmed affected sessions are listed before applying and reset after applying.

            **Full Changelog**: https://github.com/AdoShan/OpenClaw-ModelFetch/compare/v0.2.3...v0.2.4
          generate_release_notes: false
          draft: false
          make_latest: true
