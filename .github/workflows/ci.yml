name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Test, Build, Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject third-party commit attribution
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$(git rev-list --max-count=1 "$HEAD_SHA")"
          else
            RANGE="$BASE_SHA..$HEAD_SHA"
          fi
          if git log --format=%B "$RANGE" | grep -Eiq 'co-authored-by:[[:space:]]*claude|generated with[[:space:]]+claude'; then
            echo "::error::Commit messages must not contain Claude attribution."
            exit 1
          fi
          echo "No forbidden commit attribution found."

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run plugin:build

      - name: Validate plugin
        run: npm run plugin:validate

      - name: Package dry run
        run: npm pack --dry-run

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
